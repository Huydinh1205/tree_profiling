name: app tests

# The Tree Profiling app is used on Windows, so its tests run on Windows (and on Linux) for every change.
on:
  push:
    paths: ["app/**", "processes/**", ".github/workflows/app-tests.yml"]
  pull_request:
    paths: ["app/**", "processes/**", ".github/workflows/app-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      TREEPROF_SCRIPT_PYTHON: python        # the scripts' libraries are installed into the same Python here
      QT_QPA_PLATFORM: offscreen            # the window is never shown on a screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: What Qt needs on Linux to run without a screen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Libraries of the app, of its tests and of the processing scripts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -r ../processes/requirements.txt
      - name: Core tests (includes the real merge_sat.py and tree_info.py on a made-up forest)
        run: python -m unittest discover -s tests -t . -v
      - name: Window tests (the real window, driven by the tests; also starts the app the way pythonw.exe does)
        run: python -m pytest tests_gui -v
